# Builds the merchant design preview APK separately from the YoPay device app.
name: moynapay-android

on:
  workflow_dispatch:
  push:
    paths:
      - 'moynapay-android/**'
      - '.github/workflows/moynapay-android.yml'
  pull_request:
    paths:
      - 'moynapay-android/**'
      - '.github/workflows/moynapay-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The repository has no Gradle wrapper JAR; supply the pinned version.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MoynaPay debug APK
        working-directory: moynapay-android
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -Pandroid.builder.sdkDownload=true \
            -Pandroid.suppressUnsupportedCompileSdk=35

      - name: Upload MoynaPay debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moynapay-merchant-debug-apk
          path: moynapay-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
